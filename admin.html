<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesAgent — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#171923;font:14px Inter,system-ui,Arial}.wrap{max-width:1250px;margin:30px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{margin:0}.head a{color:#171923;margin-left:14px}.card{background:#fff;border:1px solid #e2e5eb;border-radius:14px;padding:20px;margin-top:20px}.login{max-width:450px;margin:60px auto}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #9ba2ad;border-radius:8px}.btn{border:0;border-radius:8px;padding:9px 13px;background:#171923;color:white;font-weight:700}.btn.alt{background:#e9ebef;color:#171923}.btn.danger{background:#a32121}.status{min-height:20px;font-size:13px}.err{color:#b42318}.ok{color:#087443}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #b9c0ca;border-radius:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid #e7e9ee;text-align:left;vertical-align:middle}th{background:#f7f8fa}td img{width:65px;height:55px;object-fit:contain;border-radius:6px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:4px 8px;background:#edf0f4;border-radius:20px;font-size:12px}.hidden{display:none!important}.muted{color:#687080;font-size:12px}
</style></head><body><main class="wrap">
<header class="head"><h1>SalesAgent Admin</h1><div><a href="./index.html">New Product</a><a href="./dashboard.html">User Dashboard</a></div></header>
<section class="card login" id="loginBox"><h2>Admin login</h2><p class="muted">Authorized admin account only.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" value="salesagentic.info@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"></div><button class="btn" id="loginBtn">Login</button><p id="loginStatus" class="status"></p></section>
<section class="card hidden" id="adminPanel"><div class="head"><div><h2>All products</h2><p class="muted" id="summary">Loading…</p></div><button class="btn alt" id="logoutBtn">Logout</button></div><div class="toolbar"><input id="search" placeholder="Search product, mobile, browser ID"><select id="statusFilter"><option value="">All promotion statuses</option><option>Pending</option><option>Approved</option><option>Paused</option><option>Rejected</option></select><select id="paymentFilter"><option value="">All payment statuses</option><option>Pending</option><option>Verified</option></select><button class="btn alt" id="refreshBtn">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Photo</th><th>Product</th><th>Mobile / Location</th><th>Plan</th><th>Browser ID</th><th>Payment</th><th>Promotion</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody></table></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,collection,getDocs,query,orderBy,doc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const cfg={apiKey:"AIzaSyAzJoZn0twxiIvLTd1yWgo0k0PepV4WoUA",authDomain:"salesagent-2c22f.firebaseapp.com",projectId:"salesagent-2c22f",storageBucket:"salesagent-2c22f.firebasestorage.app",messagingSenderId:"614955740633",appId:"1:614955740633:web:8478a4a242984d79adfdc8",measurementId:"G-3VE4DV0KG0"};
const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);
const ADMIN_EMAIL="salesagentic.info@gmail.com";let all=[];
function message(s,err=false){$("loginStatus").textContent=s;$("loginStatus").className="status "+(err?"err":"ok")}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){ $("rows").innerHTML='<tr><td colspan="8">Loading products…</td></tr>';try{const snap=await getDocs(collection(db,"products"));all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render();}catch(e){$("rows").innerHTML=`<tr><td colspan="8">Load failed: ${escapeHtml(e.message)}</td></tr>`;console.error(e)}}
function render(){const term=$("search").value.trim().toLowerCase(),sf=$("statusFilter").value,pf=$("paymentFilter").value;const items=all.filter(p=>(!sf||(p.approvalStatus||"Pending")===sf)&&(!pf||(p.paymentStatus||"Pending")===pf)&&(!term||[p.productName,p.mobile,p.browserId,p.location,p.description].some(v=>String(v||"").toLowerCase().includes(term))));$("summary").textContent=`${items.length} matching / ${all.length} total product(s)`;const tbody=$("rows");tbody.innerHTML="";if(!items.length){tbody.innerHTML='<tr><td colspan="8">No products found.</td></tr>';return}items.forEach(p=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${p.productPhoto?`<img src="${escapeHtml(p.productPhoto)}" alt="">`:"—"}</td><td><strong>${escapeHtml(p.productName)}</strong><div class="muted">${escapeHtml(p.description)}</div></td><td>${escapeHtml(p.mobile)}<div class="muted">${escapeHtml(p.location)}</div></td><td>₹${Number(p.plan||0)}</td><td class="muted">${escapeHtml(p.browserId)}</td><td><span class="pill">${escapeHtml(p.paymentStatus||"Pending")}</span></td><td><span class="pill">${escapeHtml(p.approvalStatus||"Pending")}</span></td><td><div class="actions"><button class="btn" data-action="approve">Approve</button><button class="btn alt" data-action="pause">Pause</button><button class="btn alt" data-action="pending">Pending</button><button class="btn" data-action="payment">${p.paymentStatus==="Verified"?"Unverify":"Verify payment"}</button><button class="btn danger" data-action="delete">Delete</button></div></td>`;tr.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>act(p,b.dataset.action)));tbody.append(tr)})}
async function act(p,action){try{if(action==="delete"){if(!confirm(`Permanently delete ${p.productName||"this product"}?`))return;await deleteDoc(doc(db,"products",p.id));all=all.filter(x=>x.id!==p.id)}else{const update={};if(action==="approve")update.approvalStatus="Approved";if(action==="pause")update.approvalStatus="Paused";if(action==="pending")update.approvalStatus="Pending";if(["approve","pause","pending"].includes(action)){update.statusUpdatedAt=serverTimestamp();update.statusUpdatedBy=auth.currentUser.email}if(action==="payment"){update.paymentStatus=p.paymentStatus==="Verified"?"Pending":"Verified";update.paymentVerifiedAt=serverTimestamp();update.paymentVerifiedBy=auth.currentUser.email}await updateDoc(doc(db,"products",p.id),update);const target=all.find(x=>x.id===p.id);Object.assign(target,action==="payment"?{paymentStatus:update.paymentStatus}:{approvalStatus:update.approvalStatus})}render()}catch(e){alert("Action failed: "+e.message);console.error(e)}}
$("search").addEventListener("input",render);$("statusFilter").addEventListener("change",render);$("paymentFilter").addEventListener("change",render);$("refreshBtn").addEventListener("click",load);
$("loginBtn").addEventListener("click",async()=>{const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(email!==ADMIN_EMAIL){message("This email is not authorized.",true);return}if(!password){message("Enter admin password.",true);return}$("loginBtn").disabled=true;message("Signing in…");try{const cred=await signInWithEmailAndPassword(auth,email,password);if((cred.user.email||"").toLowerCase()!==ADMIN_EMAIL){await signOut(auth);throw Error("Not an authorized admin account.")}$("loginBox").classList.add("hidden");$("adminPanel").classList.remove("hidden");await load()}catch(e){message(e.message,true)}finally{$("loginBtn").disabled=false}});
$("logoutBtn").addEventListener("click",async()=>{await signOut(auth);$("adminPanel").classList.add("hidden");$("loginBox").classList.remove("hidden");$("password").value=""});
onAuthStateChanged(auth,u=>{if(u&&(u.email||"").toLowerCase()===ADMIN_EMAIL){$("loginBox").classList.add("hidden");$("adminPanel").classList.remove("hidden");load()}});
</script></body></html>
