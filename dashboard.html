<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesAgent — User Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#171923;font:15px Inter,system-ui,Arial}.wrap{max-width:1050px;margin:35px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{margin:0}.links a{color:#171923;margin-left:14px}.card{background:white;border:1px solid #e3e6ec;border-radius:14px;padding:22px;margin-top:20px;box-shadow:0 8px 25px #1b23300a}.login{max-width:520px;margin:28px auto}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #9ba2ad;border-radius:8px}.btn{padding:11px 20px;background:#171923;color:#fff;border:0;border-radius:8px;font-weight:700}.muted{color:#687080;font-size:13px;line-height:1.5}.status{min-height:20px;font-size:13px}.error{color:#b42318}.ok{color:#087443}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.product{border:1px solid #e2e5eb;border-radius:12px;padding:14px;background:#fff}.product img{width:100%;height:160px;object-fit:contain;background:#f6f7f9;border-radius:8px}.product h3{margin:12px 0 6px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef0f4;font-size:12px;margin:3px 4px 3px 0}.hidden{display:none!important}
</style></head><body><main class="wrap">
<header class="head"><h1>SalesAgent — User Dashboard</h1><div class="links"><a href="./index.html">New Product</a><a href="./admin.html">Admin</a></div></header>
<section class="card login" id="loginBox"><h2>Access your products</h2><p class="muted">Use the same browser where you submitted your product. Enter your registered mobile number and Browser ID.</p>
<div class="field"><label for="mobile">10-digit mobile number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Enter mobile number"></div>
<div class="field"><label for="browserId">Browser ID</label><input id="browserId" placeholder="Loading browser ID"></div>
<button class="btn" id="loginBtn">View my products</button><p id="loginStatus" class="status"></p></section>
<section class="card hidden" id="results"><h2>Your products</h2><p class="muted" id="resultInfo"></p><div class="products" id="productList"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getAuth,onAuthStateChanged,signInAnonymously,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const cfg={apiKey:"AIzaSyAzJoZn0twxiIvLTd1yWgo0k0PepV4WoUA",authDomain:"salesagent-2c22f.firebaseapp.com",projectId:"salesagent-2c22f",storageBucket:"salesagent-2c22f.firebasestorage.app",messagingSenderId:"614955740633",appId:"1:614955740633:web:8478a4a242984d79adfdc8",measurementId:"G-3VE4DV0KG0"};
const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);
function getBrowserId(){let id=localStorage.getItem("salesagent_browser_id");if(!id){id=crypto.randomUUID();localStorage.setItem("salesagent_browser_id",id)}return id}
const currentBrowserId=getBrowserId();$("browserId").value=currentBrowserId;let user=null;
function setStatus(s,err=false){$("loginStatus").textContent=s;$("loginStatus").className="status "+(err?"error":"ok")}
async function init(){await setPersistence(auth,browserLocalPersistence);user=await new Promise(resolve=>{const unsub=onAuthStateChanged(auth,u=>{unsub();resolve(u)})});if(!user)user=(await signInAnonymously(auth)).user}
function safeText(value){return String(value??"")}
function render(items){const list=$("productList");list.innerHTML="";if(!items.length){list.textContent="No products found for this mobile number and Browser ID.";return}items.forEach(p=>{const card=document.createElement("article");card.className="product";const img=document.createElement("img");img.src=p.productPhoto||"";img.alt=p.productName||"Product";card.append(img);const h=document.createElement("h3");h.textContent=p.productName||"Untitled product";card.append(h);const desc=document.createElement("p");desc.textContent=p.description||"";card.append(desc);const meta=document.createElement("p");meta.innerHTML=`<span class="pill">Plan ₹${Number(p.plan||0)}</span><span class="pill">Payment: ${safeText(p.paymentStatus||"Pending")}</span><span class="pill">Promotion: ${safeText(p.approvalStatus||"Pending")}</span>`;card.append(meta);const loc=document.createElement("p");loc.className="muted";loc.textContent=(p.location||"")+(p.radius?` · ${p.radius} km radius`:"");card.append(loc);list.append(card)})}
$("loginBtn").addEventListener("click",async()=>{const mobile=$("mobile").value.trim(),browserId=$("browserId").value.trim();if(!/^[0-9]{10}$/.test(mobile)){setStatus("Enter a valid 10-digit mobile number.",true);return}if(browserId!==currentBrowserId){setStatus("This Browser ID does not match this browser. Use the original browser identity.",true);return}$("loginBtn").disabled=true;setStatus("Checking your products…");try{if(!user)await init();const q=query(collection(db,"products"),where("ownerUid","==",user.uid),where("browserId","==",browserId));const snap=await getDocs(q);const items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.mobile===mobile).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$("results").classList.remove("hidden");$("resultInfo").textContent=`Found ${items.length} product(s).`;render(items);setStatus(items.length?"Products loaded.":"No matching products found.")}catch(e){console.error(e);setStatus("Could not load products: "+e.message,true)}finally{$("loginBtn").disabled=false}});
init().catch(e=>setStatus("Firebase authentication failed: "+e.message,true));
</script></body></html>
