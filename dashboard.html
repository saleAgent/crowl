
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Sales Agent - Dashboard</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.container{max-width:1250px;margin:auto;padding:25px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
h1{font-size:27px;margin:0}
.sub{color:#777;font-size:13px;margin-top:7px}
.card{background:white;border:1px solid #e5e5e5;border-radius:13px;padding:22px;margin-bottom:20px}
.login{max-width:440px;margin:70px auto}
label{display:block;font-weight:bold;font-size:13px;margin:15px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#333}
.btn{border:0;border-radius:7px;padding:11px 18px;font-weight:bold}
.primary{background:#171717;color:white}
.danger{background:#fee2e2;color:#b42318}
.light{background:#eee;color:#222}
.full{width:100%;margin-top:18px}
.status{font-size:13px;margin-top:12px;min-height:18px}
.error{color:#b42318}
.success{color:#16794b}
.hidden{display:none!important}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:13px 11px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}
th{background:#f8f8f8;color:#555}
.product-img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid #eee}
.action{padding:7px 11px;border:0;border-radius:6px;margin-right:4px}
.edit{background:#e8efff;color:#1749a0}
.delete{background:#fee2e2;color:#b42318}
.count{font-weight:bold;font-size:22px}
.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:99}
.modal-bg.show{display:flex}
.modal{background:white;width:100%;max-width:550px;max-height:90vh;overflow:auto;padding:23px;border-radius:13px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:20px}
.close{border:0;background:#eee;border-radius:7px;padding:8px 13px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.empty{text-align:center;color:#777;padding:35px}
@media(max-width:600px){
.container{padding:14px}
.header{align-items:flex-start;flex-direction:column}
h1{font-size:23px}
.card{padding:15px}
.login{margin:35px auto}
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN / VERIFICATION -->

<section class="card login" id="loginPanel">

<h1>Your Sales Agent</h1>
<p class="sub">Verify your details to access your dashboard.</p>

<form id="verifyForm">

<label>Registered mobile number</label>
<input id="verifyMobile" type="tel"
maxlength="10" inputmode="numeric"
placeholder="Enter 10 digit mobile number" required>

<label>Registered IP address</label>
<input id="verifyIP" type="text"
placeholder="Enter your registered IP address" required>

<button class="btn primary full" id="verifyBtn">
Access Dashboard
</button>

<p class="status" id="loginStatus"></p>

</form>
</section>


<!-- MAIN DASHBOARD -->

<section id="dashboardPanel" class="hidden">

<div class="header">
<div>
<h1>My Product Dashboard</h1>
<p class="sub">Manage all your submitted products.</p>
</div>

<button class="btn light" id="logoutBtn">Logout</button>
</div>

<div class="card">
<div class="count" id="productCount">0</div>
<div class="sub">Total submitted products</div>
</div>

<div class="card">

<h2>My Products</h2>

<div class="table-wrap">

<table>
<thead>
<tr>
<th>Photo</th>
<th>Product Name</th>
<th>Mobile</th>
<th>Location</th>
<th>Plan</th>
<th>Visitors</th>
<th>Leads</th>
<th>IP Address</th>
<th>Date</th>
<th>Edit</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="productTable">
<tr>
<td colspan="11" class="empty">Loading...</td>
</tr>
</tbody>

</table>

</div>

<p class="status" id="dashboardStatus"></p>

</div>
</section>

</div>


<!-- EDIT PRODUCT MODAL -->

<div class="modal-bg" id="editModal">

<div class="modal">

<div class="modal-head">
<h2>Edit Product</h2>
<button class="close" id="closeModal">✕</button>
</div>

<form id="editForm">

<label>Product name</label>
<input id="editName" required maxlength="100">

<label>Description</label>
<textarea id="editDescription" rows="4"></textarea>

<label>Mobile</label>
<input id="editMobile" maxlength="10" required>

<label>Location</label>
<input id="editLocation" required>

<label>Choose plan</label>
<select id="editPlan">
<option value="299">₹299</option>
<option value="399">₹399</option>
<option value="499">₹499</option>
<option value="599">₹599</option>
<option value="699">₹699</option>
<option value="799">₹799</option>
<option value="899">₹899</option>
<option value="999">₹999</option>
</select>

<label>Promotion radius (KM)</label>
<input id="editRadius" type="number" min="1" max="100" required>

<p class="status" id="editStatus"></p>

<div class="actions">
<button type="button" class="btn light" id="cancelEdit">Cancel</button>
<button type="submit" class="btn primary">Save Changes</button>
</div>

</form>
</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getFirestore,
 collection,
 query,
 where,
 getDocs,
 doc,
 updateDoc,
 deleteDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
 getAuth,
 signInAnonymously,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


// FIREBASE CONFIG

const firebaseConfig = {
 apiKey: "AIzaSyAzJoZn0twxiIvLTd1yWgo0k0PepV4WoUA",
 authDomain: "salesagent-2c22f.firebaseapp.com",
 projectId: "salesagent-2c22f",
 storageBucket: "salesagent-2c22f.firebasestorage.app",
 messagingSenderId: "614955740633",
 appId: "1:614955740633:web:8478a4a242984d79adfdc8",
 measurementId: "G-3VE4DV0KG0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let products = [];
let editingId = null;
let verifiedMobile = "";
let verifiedIP = "";

const plans = {
 299:{minV:1500,maxV:2500,minL:3,maxL:15},
 399:{minV:1800,maxV:2800,minL:6,maxL:18},
 499:{minV:2100,maxV:3100,minL:9,maxL:21},
 599:{minV:2400,maxV:3400,minL:12,maxL:24},
 699:{minV:2700,maxV:3700,minL:15,maxL:27},
 799:{minV:3000,maxV:4000,minL:18,maxL:30},
 899:{minV:3300,maxV:4300,minL:21,maxL:33},
 999:{minV:3600,maxV:4600,minL:24,maxL:36}
};


// AUTHENTICATION

async function initializeAuthentication(){

 try{

  if(!auth.currentUser){
   await signInAnonymously(auth);
  }

 }catch(error){

  $("loginStatus").textContent =
   error.code + ": " + error.message;

  $("loginStatus").className = "status error";

 }

}

onAuthStateChanged(auth,user=>{

 currentUser=user;

 if(!user){
  $("loginStatus").textContent =
   "Firebase authentication unavailable. Please reload.";
 }

});


// HELPER: SHOW MESSAGE

function message(id,text,type=""){

 $(id).textContent=text;
 $(id).className="status "+type;

}


// VERIFY MOBILE + IP + FIREBASE USER

$("verifyForm").addEventListener("submit",async e=>{

 e.preventDefault();

 if(!currentUser){

  message(
   "loginStatus",
   "Firebase is connecting. Please wait and try again.",
   "error"
  );

  return;
 }

 const mobile=$("verifyMobile").value.trim();
 const ip=$("verifyIP").value.trim();

 if(!/^[0-9]{10}$/.test(mobile)){

  message(
   "loginStatus",
   "Enter a valid 10 digit mobile number.",
   "error"
  );

  return;
 }

 if(!ip){

  message("loginStatus","Enter your registered IP address.","error");
  return;
 }

 $("verifyBtn").disabled=true;
 $("verifyBtn").textContent="Verifying...";

 try{

  const q=query(
   collection(db,"products"),
   where("ownerUid","==",currentUser.uid),
   where("mobile","==",mobile),
   where("userIP","==",ip)
  );

  const snapshot=await getDocs(q);

  if(snapshot.empty){

   message(
    "loginStatus",
    "Verification failed. Check your mobile number and registered IP address, and use the original browser.",
    "error"
   );

   return;
  }

  verifiedMobile=mobile;
  verifiedIP=ip;

  products=snapshot.docs.map(d=>({
   id:d.id,
   ...d.data()
  }));

  $("loginPanel").classList.add("hidden");
  $("dashboardPanel").classList.remove("hidden");

  renderProducts();

  message("dashboardStatus","Products loaded successfully.","success");

 }catch(error){

  console.error(error);

  message(
   "loginStatus",
   error.code+": "+error.message,
   "error"
  );

 }finally{

  $("verifyBtn").disabled=false;
  $("verifyBtn").textContent="Access Dashboard";

 }

});


// RENDER PRODUCT TABLE

function renderProducts(){

 const tbody=$("productTable");

 tbody.innerHTML="";

 $("productCount").textContent=products.length;

 if(!products.length){

  const tr=document.createElement("tr");
  const td=document.createElement("td");

  td.colSpan=11;
  td.className="empty";
  td.textContent="No products found.";

  tr.appendChild(td);
  tbody.appendChild(tr);

  return;
 }

 products.sort((a,b)=>
  (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
 );

 products.forEach(p=>{

  const tr=document.createElement("tr");

  // PHOTO

  const photoCell=document.createElement("td");

  const img=document.createElement("img");

  img.className="product-img";
  img.src=p.productPhoto||"";
  img.alt=p.productName||"Product";

  photoCell.appendChild(img);


  // BASIC COLUMNS

  const date=p.createdAt?.seconds
   ? new Date(p.createdAt.seconds*1000).toLocaleDateString("en-IN")
   : "—";

  const values=[
   p.productName,
   p.mobile,
   p.location,
   "₹"+p.plan,
   (p.minVisitors||0).toLocaleString("en-IN")+"–"+(p.maxVisitors||0).toLocaleString("en-IN"),
   (p.minLeads||0)+"–"+(p.maxLeads||0),
   p.userIP,
   date
  ];

  tr.appendChild(photoCell);

  values.forEach(value=>{

   const td=document.createElement("td");

   td.textContent=value??"—";

   tr.appendChild(td);

  });


  // EDIT BUTTON

  const editCell=document.createElement("td");

  const editBtn=document.createElement("button");

  editBtn.className="action edit";
  editBtn.textContent="Edit";

  editBtn.addEventListener("click",()=>openEdit(p));

  editCell.appendChild(editBtn);

  tr.appendChild(editCell);


  // DELETE BUTTON

  const deleteCell=document.createElement("td");

  const deleteBtn=document.createElement("button");

  deleteBtn.className="action delete";
  deleteBtn.textContent="Delete";

  deleteBtn.addEventListener("click",()=>deleteProduct(p.id));

  deleteCell.appendChild(deleteBtn);

  tr.appendChild(deleteCell);

  tbody.appendChild(tr);

 });

}


// OPEN EDIT MODAL

function openEdit(p){

 editingId=p.id;

 $("editName").value=p.productName||"";
 $("editDescription").value=p.description||"";
 $("editMobile").value=p.mobile||"";
 $("editLocation").value=p.location||"";
 $("editPlan").value=String(p.plan||299);
 $("editRadius").value=p.radius||10;

 $("editModal").classList.add("show");

}


// CLOSE MODAL

function closeEdit(){

 $("editModal").classList.remove("show");
 editingId=null;

}

$("closeModal").addEventListener("click",closeEdit);
$("cancelEdit").addEventListener("click",closeEdit);


// SAVE EDITED PRODUCT

$("editForm").addEventListener("submit",async e=>{

 e.preventDefault();

 if(!editingId)return;

 const mobile=$("editMobile").value.trim();

 if(!/^[0-9]{10}$/.test(mobile)){

  message("editStatus","Enter a valid 10 digit mobile number.","error");
  return;

 }

 const plan=Number($("editPlan").value);
 const estimate=plans[plan];

 const updatedData={

  productName:$("editName").value.trim(),

  description:$("editDescription").value.trim(),

  mobile:mobile,

  location:$("editLocation").value.trim(),

  plan:plan,

  radius:Number($("editRadius").value),

  minVisitors:estimate.minV,
  maxVisitors:estimate.maxV,

  minLeads:estimate.minL,
  maxLeads:estimate.maxL,

  updatedAt:serverTimestamp()

 };

 try{

  await updateDoc(
   doc(db,"products",editingId),
   updatedData
  );

  message("dashboardStatus","Product updated successfully.","success");

  closeEdit();

  await refreshProducts();

 }catch(error){

  message("editStatus",error.message,"error");

 }

});


// DELETE PRODUCT

async function deleteProduct(id){

 const confirmed=confirm(
  "Are you sure you want to delete this product permanently?"
 );

 if(!confirmed)return;

 try{

  await deleteDoc(doc(db,"products",id));

  message("dashboardStatus","Product deleted successfully.","success");

  await refreshProducts();

 }catch(error){

  message("dashboardStatus",error.message,"error");

 }

}


// REFRESH PRODUCTS

async function refreshProducts(){

 const q=query(
  collection(db,"products"),
  where("ownerUid","==",currentUser.uid),
  where("mobile","==",verifiedMobile),
  where("userIP","==",verifiedIP)
 );

 const snapshot=await getDocs(q);

 products=snapshot.docs.map(d=>({
  id:d.id,
  ...d.data()
 }));

 renderProducts();

}


// LOGOUT

$("logoutBtn").addEventListener("click",()=>{

 $("dashboardPanel").classList.add("hidden");
 $("loginPanel").classList.remove("hidden");

 $("verifyForm").reset();

 verifiedMobile="";
 verifiedIP="";
 products=[];

 message("loginStatus","");

});


// START APP

initializeAuthentication();

</script>
</body>
</html>
