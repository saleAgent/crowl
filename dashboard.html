<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Sales Agent - User Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.container{max-width:1250px;margin:auto;padding:25px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
h1{font-size:27px;margin:0}.sub{color:#777;font-size:13px;margin-top:7px}.card{background:white;border:1px solid #e5e5e5;border-radius:13px;padding:22px;margin-bottom:20px}
.login{max-width:440px;margin:70px auto}label{display:block;font-weight:bold;font-size:13px;margin:15px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;outline:none}input:focus,textarea:focus,select:focus{border-color:#333}
.btn{border:0;border-radius:7px;padding:11px 18px;font-weight:bold}.primary{background:#171717;color:white}.danger{background:#fee2e2;color:#b42318}.light{background:#eee;color:#222}
.full{width:100%;margin-top:18px}.status{font-size:13px;margin-top:12px;min-height:18px}.error{color:#b42318}.success{color:#16794b}.hidden{display:none!important}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:13px 11px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}
th{background:#f8f8f8;color:#555}.product-img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid #eee}
.action{padding:7px 11px;border:0;border-radius:6px;margin-right:4px}.edit{background:#e8efff;color:#1749a0}.delete{background:#fee2e2;color:#b42318}
.count{font-weight:bold;font-size:22px}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:99}
.modal-bg.show{display:flex}.modal{background:white;width:100%;max-width:550px;max-height:90vh;overflow:auto;padding:23px;border-radius:13px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:20px}.close{border:0;background:#eee;border-radius:7px;padding:8px 13px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.empty{text-align:center;color:#777;padding:35px}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.approved{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.paused{background:#e5e7eb;color:#374151}
@media(max-width:600px){.container{padding:14px}.header{align-items:flex-start;flex-direction:column}h1{font-size:23px}.card{padding:15px}.login{margin:35px auto}}
</style>
</head>
<body>
<div class="container">
<section class="card login" id="loginPanel">
<h1>Your Sales Agent</h1><p class="sub">Verify your registered details to access your dashboard.</p>
<form id="verifyForm">
<label>Registered mobile number</label><input id="verifyMobile" type="tel" maxlength="10" inputmode="numeric" placeholder="Enter 10 digit mobile number" required>
<label>Registered IP address</label><input id="verifyIP" type="text" placeholder="Enter your registered IP address" required>
<button class="btn primary full" id="verifyBtn" type="submit">Access Dashboard</button>
<p class="status" id="loginStatus" role="status"></p>
</form></section>
<section id="dashboardPanel" class="hidden">
<div class="header"><div><h1>My Product Dashboard</h1><p class="sub">Manage all your submitted products.</p></div><button class="btn light" id="logoutBtn">Logout</button></div>
<div class="card"><div class="count" id="productCount">0</div><div class="sub">Total submitted products</div></div>
<div class="card"><h2>My Products</h2><div class="table-wrap"><table>
<thead><tr><th>Photo</th><th>Product Name</th><th>Mobile</th><th>Location</th><th>Plan</th><th>Visitors</th><th>Leads</th><th>IP Address</th><th>Date</th><th>Edit</th><th>Delete</th><th>Status</th></tr></thead>
<tbody id="productTable"><tr><td colspan="12" class="empty">Login to load products.</td></tr></tbody>
</table></div><p class="status" id="dashboardStatus" role="status"></p></div>
</section></div>
<div class="modal-bg" id="editModal"><div class="modal">
<div class="modal-head"><h2>Edit Product</h2><button class="close" id="closeModal" type="button">✕</button></div>
<form id="editForm">
<label>Product name</label><input id="editName" required maxlength="100">
<label>Description</label><textarea id="editDescription" rows="4"></textarea>
<label>Mobile</label><input id="editMobile" maxlength="10" required>
<label>Location</label><input id="editLocation" required>
<label>Choose plan</label><select id="editPlan"><option value="299">₹299</option><option value="399">₹399</option><option value="499">₹499</option><option value="599">₹599</option><option value="699">₹699</option><option value="799">₹799</option><option value="899">₹899</option><option value="999">₹999</option></select>
<label>Promotion radius (KM)</label><input id="editRadius" type="number" min="1" max="100" required>
<p class="status" id="editStatus"></p><div class="actions"><button type="button" class="btn light" id="cancelEdit">Cancel</button><button type="submit" class="btn primary">Save Changes</button></div>
</form></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,query,where,onSnapshot,doc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzJoZn0twxiIvLTd1yWgo0k0PepV4WoUA",
  authDomain: "salesagent-2c22f.firebaseapp.com",
  projectId: "salesagent-2c22f",
  storageBucket: "salesagent-2c22f.firebasestorage.app",
  messagingSenderId: "614955740633",
  appId: "1:614955740633:web:8478a4a242984d79adfdc8",
  measurementId: "G-3VE4DV0KG0"
};

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);
let currentUser=null,products=[],editingId=null,verifiedMobile="",verifiedIP="",stopProductsListener=null;
const plans={299:{minV:1500,maxV:2500,minL:3,maxL:15},399:{minV:1800,maxV:2800,minL:6,maxL:18},499:{minV:2100,maxV:3100,minL:9,maxL:21},599:{minV:2400,maxV:3400,minL:12,maxL:24},699:{minV:2700,maxV:3700,minL:15,maxL:27},799:{minV:3000,maxV:4000,minL:18,maxL:30},899:{minV:3300,maxV:4300,minL:21,maxL:33},999:{minV:3600,maxV:4600,minL:24,maxL:36}};
function message(id,text,type=""){ $(id).textContent=text;$(id).className="status "+type; }
onAuthStateChanged(auth,user=>{currentUser=user;if(!user)signInAnonymously(auth).catch(e=>message("loginStatus",e.message,"error"));});
if(!auth.currentUser)signInAnonymously(auth).catch(e=>message("loginStatus",e.message,"error"));
$("verifyForm").addEventListener("submit",e=>{
 e.preventDefault();if(!currentUser){message("loginStatus","Firebase is connecting. Please wait and try again.","error");return;}
 const mobile=$("verifyMobile").value.trim(),ip=$("verifyIP").value.trim();
 if(!/^[0-9]{10}$/.test(mobile)){message("loginStatus","Enter a valid 10 digit mobile number.","error");return;}
 if(!ip){message("loginStatus","Enter your registered IP address.","error");return;}
 $("verifyBtn").disabled=true;$("verifyBtn").textContent="Verifying...";
 const q=query(collection(db,"products"),where("ownerUid","==",currentUser.uid),where("mobile","==",mobile),where("userIP","==",ip));
 if(stopProductsListener){stopProductsListener();stopProductsListener=null;}
 stopProductsListener=onSnapshot(q,snap=>{
  products=snap.docs.map(d=>({id:d.id,...d.data()}));
  verifiedMobile=mobile;verifiedIP=ip;
  $("loginPanel").classList.add("hidden");$("dashboardPanel").classList.remove("hidden");
  renderProducts();message("dashboardStatus","Live product updates are enabled.","success");
  $("verifyBtn").disabled=false;$("verifyBtn").textContent="Access Dashboard";
 },err=>{console.error(err);message("loginStatus",err.code+": "+err.message,"error");$("verifyBtn").disabled=false;$("verifyBtn").textContent="Access Dashboard";});
});
function renderProducts(){
 const tbody=$("productTable");tbody.innerHTML="";$("productCount").textContent=products.length;
 if(!products.length){tbody.innerHTML='<tr><td colspan="12" class="empty">No products found.</td></tr>';return;}
 products.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 products.forEach(p=>{
  const tr=document.createElement("tr"),photo=document.createElement("td"),img=document.createElement("img");
  img.className="product-img";img.src=p.productPhoto||"";img.alt=p.productName||"Product";photo.appendChild(img);tr.appendChild(photo);
  const date=p.createdAt?.seconds?new Date(p.createdAt.seconds*1000).toLocaleDateString("en-IN"):"—";
  [p.productName,p.mobile,p.location,"₹"+(p.plan??"—"),(p.minVisitors||0).toLocaleString("en-IN")+"–"+(p.maxVisitors||0).toLocaleString("en-IN"),(p.minLeads||0)+"–"+(p.maxLeads||0),p.userIP,date].forEach(v=>{const td=document.createElement("td");td.textContent=v??"—";tr.appendChild(td);});
  const editCell=document.createElement("td"),editBtn=document.createElement("button");editBtn.className="action edit";editBtn.textContent="Edit";editBtn.onclick=()=>openEdit(p);editCell.appendChild(editBtn);tr.appendChild(editCell);
  const delCell=document.createElement("td"),delBtn=document.createElement("button");delBtn.className="action delete";delBtn.textContent="Delete";delBtn.onclick=()=>deleteProduct(p.id);delCell.appendChild(delBtn);tr.appendChild(delCell);
  const statusCell=document.createElement("td"),status=document.createElement("span"),s=p.approvalStatus||"pending";
  status.className="badge "+(s==="approved"?"approved":s==="paused"?"paused":"pending");
  status.textContent=s==="approved"?"Approved":s==="paused"?"Paused":"Pending";statusCell.appendChild(status);tr.appendChild(statusCell);tbody.appendChild(tr);
 });
}
function openEdit(p){editingId=p.id;$("editName").value=p.productName||"";$("editDescription").value=p.description||"";$("editMobile").value=p.mobile||"";$("editLocation").value=p.location||"";$("editPlan").value=String(p.plan||299);$("editRadius").value=p.radius||10;$("editStatus").textContent="";$("editModal").classList.add("show");}
function closeEdit(){$("editModal").classList.remove("show");editingId=null;}
$("closeModal").onclick=closeEdit;$("cancelEdit").onclick=closeEdit;
$("editForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!editingId)return;const mobile=$("editMobile").value.trim();if(!/^[0-9]{10}$/.test(mobile)){message("editStatus","Enter a valid 10 digit mobile number.","error");return;}
 const plan=Number($("editPlan").value),est=plans[plan];
 try{await updateDoc(doc(db,"products",editingId),{productName:$("editName").value.trim(),description:$("editDescription").value.trim(),mobile,location:$("editLocation").value.trim(),plan,radius:Number($("editRadius").value),minVisitors:est.minV,maxVisitors:est.maxV,minLeads:est.minL,maxLeads:est.maxL,updatedAt:serverTimestamp()});closeEdit();message("dashboardStatus","Product updated successfully.","success");}
 catch(err){message("editStatus",err.message,"error");}
});
async function deleteProduct(id){if(!confirm("Are you sure you want to delete this product permanently?"))return;try{await deleteDoc(doc(db,"products",id));message("dashboardStatus","Product deleted successfully.","success");}catch(e){message("dashboardStatus",e.message,"error");}}
$("logoutBtn").onclick=()=>{if(stopProductsListener){stopProductsListener();stopProductsListener=null;}$("dashboardPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");$("verifyForm").reset();products=[];verifiedMobile="";verifiedIP="";message("loginStatus","");};
</script></body></html>
